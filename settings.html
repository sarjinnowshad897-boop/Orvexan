<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Orvexan Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Oswald:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      background-color: #faf8f5;
      color: #111111;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Header */
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 36px;
      border-bottom: 1px solid rgba(17, 17, 17, 0.08);
    }

    .brand-wordmark {
      font-family: 'Oswald', sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      text-decoration: none;
      color: inherit;
      letter-spacing: -0.5px;
      transform: scaleY(1.1);
      display: inline-block;
    }

    .back-home-link {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: inherit;
      padding: 9px 16px;
      border: 1px solid currentColor;
      border-radius: 4px;
      transition: opacity 0.2s ease;
    }

    .back-home-link:hover {
      opacity: 0.65;
    }

    /* Main Container */
    .settings-container {
      max-width: 720px;
      margin: 54px auto;
      padding: 0 24px;
    }

    .settings-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #8a7346;
      margin-bottom: 8px;
    }

    .settings-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 42px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .settings-desc {
      font-size: 14px;
      opacity: 0.75;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    /* Theme Cards */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .theme-card {
      background: #ffffff;
      border: 2px solid #e2ddd4;
      border-radius: 10px;
      padding: 20px 16px;
      cursor: pointer;
      text-align: left;
      color: #111111;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .theme-card:hover {
      transform: translateY(-3px);
      border-color: #b59a63;
    }

    .theme-card.active {
      border-color: #e6c280;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
    }

    .theme-preview {
      height: 64px;
      border-radius: 6px;
      margin-bottom: 14px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: flex-end;
      padding: 8px;
    }

    .preview-pill {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
    }

    .theme-card h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .theme-card p {
      font-size: 12px;
      color: #666666;
      line-height: 1.4;
    }

    .status-toast {
      margin-top: 22px;
      font-size: 13px;
      font-weight: 600;
      color: #8a7346;
      min-height: 20px;
    }

    /* === FULL BLACK THEME === */
    body.theme-dark {
      background-color: #0d0d0d;
      color: #f5f5f5;
    }

    body.theme-dark .settings-header {
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }

    body.theme-dark .theme-card {
      background-color: #161616;
      border-color: #2c2c2c;
      color: #ffffff;
    }

    body.theme-dark .theme-card p {
      color: #a0a0a0;
    }

    body.theme-dark .theme-card.active {
      border-color: #e6c280;
    }

    /* === FULL WHITE THEME === */
    body.theme-light {
      background-color: #ffffff;
      color: #111111;
    }

    body.theme-light .theme-card {
      background-color: #f8f8f8;
      border-color: #e0e0e0;
    }

    body.theme-light .theme-card.active {
      border-color: #111111;
    }

    @media (max-width: 700px) {
      .settings-header {
        padding: 16px 20px;
      }
      .theme-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header class="settings-header">
    <a href="index.html" class="brand-wordmark">ORVEXAN</a>
    <a href="index.html" class="back-home-link">&larr; Back to Store</a>
  </header>

  <main class="settings-container">
    <p class="settings-eyebrow">Preferences</p>
    <h1 class="settings-title">Storefront Appearance</h1>
    <p class="settings-desc">Choose your preferred color theme for Orvexan Fashion. Your selection is saved automatically across the store.</p>

    <div class="theme-grid">
      <!-- Option 1: Gold & Cream (Default) -->
      <button type="button" class="theme-card active" data-theme-choice="default" onclick="selectTheme('default', 'Gold & Cream')">
        <div class="theme-preview" style="background: linear-gradient(135deg, #faf8f5 55%, #141414 55%);">
          <span class="preview-pill" style="background: #e6c280; color: #111111;">Gold</span>
        </div>
        <h3>Gold &amp; Cream</h3>
        <p>Warm alabaster hero, charcoal collections &amp; champagne gold accents.</p>
      </button>

      <!-- Option 2: Full Black -->
      <button type="button" class="theme-card" data-theme-choice="dark" onclick="selectTheme('dark', 'Obsidian Black')">
        <div class="theme-preview" style="background: #0d0d0d;">
          <span class="preview-pill" style="background: #e6c280; color: #111111;">Dark</span>
        </div>
        <h3>Obsidian Black</h3>
        <p>Full matte black luxury storefront from top to bottom.</p>
      </button>

      <!-- Option 3: Full White -->
      <button type="button" class="theme-card" data-theme-choice="light" onclick="selectTheme('light', 'Pure White')">
        <div class="theme-preview" style="background: #ffffff;">
          <span class="preview-pill" style="background: #111111; color: #ffffff;">Light</span>
        </div>
        <h3>Pure White</h3>
        <p>Crisp studio white canvas with high-contrast black accents.</p>
      </button>
    </div>

    <p class="status-toast" id="theme-status"></p>
  </main>

  <script>
    function selectTheme(themeName, label) {
      document.body.classList.remove("theme-dark", "theme-light");
      if (themeName === "dark") document.body.classList.add("theme-dark");
      if (themeName === "light") document.body.classList.add("theme-light");

      document.querySelectorAll(".theme-card").forEach(card => {
        card.classList.toggle("active", card.getAttribute("data-theme-choice") === themeName);
      });

      localStorage.setItem("orvexan_theme", themeName);
      if (label) {
        document.getElementById("theme-status").textContent = "Saved: " + label + " theme applied.";
      }
    }

    (function () {
      const saved = localStorage.getItem("orvexan_theme") || "default";
      selectTheme(saved, null);
    })();
  </script>

</body>
</html>
